services:
  orderflow:
    build: .
    ports:
      - "8720:8720"
    environment:
      # simulated | binance | replay
      ORDERFLOW_FEED: ${ORDERFLOW_FEED:-simulated}
      ORDERFLOW_SYMBOL: ${ORDERFLOW_SYMBOL:-SIM-FUT}
      ORDERFLOW_TICK_SIZE: ${ORDERFLOW_TICK_SIZE:-0.25}
    volumes:
      - orderflow-data:/data
    restart: unless-stopped

volumes:
  orderflow-data:

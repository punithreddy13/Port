[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-terminal"
version = "0.1.0"
description = "Institutional order flow & liquidity analysis platform with an AI analyst"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
orderflow-terminal = "orderflow.server.app:main"

[tool.setuptools.packages.find]
include = ["orderflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
